[project]
name = "hospital-atlas"
version = "0.1.0"
description = "Multi-agent deep research over public CMS hospital data: OpenAI Agents SDK + Gemini, with cited reports"
requires-python = ">=3.12"  # Cloud Run's buildpack reads .python-version; its runtime list has 3.13+ only (3.12 fails the build)
dependencies = [
    "fastapi>=0.109.0",                # the web server
    "uvicorn>=0.27.0",                 # runs it
    "openai-agents[litellm]==0.24.0",  # Agents SDK + LiteLLM bridge; the version the course demos were verified on
    "litellm==1.83.0",                 # pinned to the demos' lock so Gemini tool calling behaves the same
    "google-cloud-aiplatform>=1.40.0", # Vertex AI auth for Gemini (older docs still call it Vertex AI)
    "httpx>=0.27",                     # async HTTP client for the CMS and PubMed APIs
]

[dependency-groups]
dev = [
    "pytest>=8.0",  # fast offline tests in tests/ (no model calls)
]
